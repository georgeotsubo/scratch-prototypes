<svg width="49" height="52" viewBox="0 0 49 52" xmlns="http://www.w3.org/2000/svg">
<!-- Vector-traced from the original Map card pin PNG (49×52 raster) so the exact
     source artwork survives without the blur a raster gets past its native size.
     Two-tone by design: white silhouette layer + a red layer with a hole punched
     for the inner glyph (nonzero fill-rule, two subpaths), matching the source's
     white halo + red body + white inner glyph. Red references icon/red directly,
     white is literal so the marker reads the same on a map regardless of theme.
     The hole is punched with an evenodd fill-rule, not currentColor overlap. -->
